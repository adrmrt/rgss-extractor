name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build
      - name: Smoke test single-file build
        shell: pwsh
        run: |
          # Same publish flags as release.yml; single-file builds behave differently (e.g. Assembly.Location is empty)
          dotnet publish "RGSS Extractor.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output smoke
          # v1 archive with one entry "a" containing "hello"
          [IO.File]::WriteAllBytes("$PWD/smoke/game.rgssad", [byte[]](0x52,0x47,0x53,0x53,0x41,0x44,0x00,0x01,0xFF,0xCA,0xAD,0xDE,0x94,0xB3,0xDA,0x43,0x9F,0x95,0x9F,0xB6,0x36,0x81))
          $p = Start-Process "$PWD/smoke/RGSS Extractor.exe" -ArgumentList 'game.rgssad', 'out' -WorkingDirectory "$PWD/smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Exit code $($p.ExitCode)" }
          if ((Get-Content smoke/out/a -Raw) -ne 'hello') { throw 'Extracted content differs' }

  non-ascii:
    name: Non-ASCII Character Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for non-ASCII characters in C# source
        run: |
          if grep -rPln '[^\x00-\x7F]' --include='*.cs' .; then
            echo "::error::Non-ASCII characters found in C# source"
            exit 1
          fi

  lint-commits:
    name: Commit Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          # Conventional Commits: type(optional scope)!: description
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9._/-]+\))?!?: .+'
          fail=0

          while IFS= read -r sha; do
            subject=$(git log -1 --format=%s "$sha")
            body=$(git log -1 --format=%B "$sha")

            echo "Checking $sha: $subject"

            if ! echo "$subject" | grep -qE "$PATTERN"; then
              echo "::error::Commit $sha does not follow Conventional Commits format (type(scope): description): $subject"
              fail=1
            fi

            if printf '%s' "$body" | LC_ALL=C grep -qP '[^\x00-\x7F]'; then
              echo "::error::Commit $sha message contains non-ASCII characters"
              fail=1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")

          exit $fail
